<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" width="100%" height="100%">
  <rect width="600" height="320" rx="16" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
  <text x="300" y="34" fill="#58a6ff" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">AES Substitution-Permutation Network (SPN Matrix)</text>
  
  <g transform="translate(40, 70)">
    <rect width="110" height="180" rx="10" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
    <text x="55" y="40" fill="#58a6ff" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">1. SubBytes</text>
    <text x="55" y="80" fill="#8b949e" font-family="sans-serif" font-size="11" text-anchor="middle">S-Box Inversion</text>
    <text x="55" y="110" fill="#8b949e" font-family="sans-serif" font-size="11" text-anchor="middle">GF(2^8) Field</text>
    <text x="55" y="140" fill="#3fb950" font-family="sans-serif" font-size="11" text-anchor="middle">Non-linear (S)</text>
  </g>

  <g transform="translate(170, 70)">
    <rect width="110" height="180" rx="10" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
    <text x="55" y="40" fill="#3fb950" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">2. ShiftRows</text>
    <text x="55" y="80" fill="#8b949e" font-family="sans-serif" font-size="11" text-anchor="middle">Row 0: 0 shifts</text>
    <text x="55" y="105" fill="#8b949e" font-family="sans-serif" font-size="11" text-anchor="middle">Row 1: 1 shift</text>
    <text x="55" y="130" fill="#8b949e" font-family="sans-serif" font-size="11" text-anchor="middle">Row 2: 2 shifts</text>
    <text x="55" y="155" fill="#8b949e" font-family="sans-serif" font-size="11" text-anchor="middle">Row 3: 3 shifts</text>
  </g>

  <g transform="translate(300, 70)">
    <rect width="110" height="180" rx="10" fill="#161b22" stroke="#d29922" stroke-width="2"/>
    <text x="55" y="40" fill="#d29922" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">3. MixColumns</text>
    <text x="55" y="80" fill="#8b949e" font-family="sans-serif" font-size="11" text-anchor="middle">Matrix Multiply</text>
    <text x="55" y="110" fill="#8b949e" font-family="sans-serif" font-size="11" text-anchor="middle">High Diffusion</text>
    <text x="55" y="140" fill="#d29922" font-family="sans-serif" font-size="11" text-anchor="middle">MDS Matrix</text>
  </g>

  <g transform="translate(430, 70)">
    <rect width="130" height="180" rx="10" fill="#161b22" stroke="#bc8cff" stroke-width="2"/>
    <text x="65" y="40" fill="#bc8cff" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">4. AddRoundKey</text>
    <text x="65" y="80" fill="#8b949e" font-family="sans-serif" font-size="11" text-anchor="middle">Bitwise XOR (⊕)</text>
    <text x="65" y="110" fill="#8b949e" font-family="sans-serif" font-size="11" text-anchor="middle">Round Key</text>
    <text x="65" y="140" fill="#bc8cff" font-family="sans-serif" font-size="11" text-anchor="middle">Key Schedule</text>
  </g>
</svg>
