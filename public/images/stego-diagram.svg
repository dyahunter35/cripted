<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="100%" height="100%">
  <rect width="600" height="300" rx="16" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
  <text x="300" y="34" fill="#3fb950" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">LSB Steganography Bit Injection (إخفاء البيانات عبر البت الأقل وزناً)</text>
  
  <!-- Pixel RGB Byte -->
  <g transform="translate(50, 70)">
    <rect width="220" height="90" rx="10" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
    <text x="110" y="30" fill="#58a6ff" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">بايت البكسل الأصلي (Carrier Byte)</text>
    <text x="110" y="65" fill="#ffffff" font-family="monospace" font-size="18" text-anchor="middle">1 1 0 1 0 1 1 <tspan fill="#f85149" font-weight="bold">0</tspan></text>
  </g>

  <!-- Secret Bit -->
  <g transform="translate(330, 70)">
    <rect width="220" height="90" rx="10" fill="#161b22" stroke="#d29922" stroke-width="2"/>
    <text x="110" y="30" fill="#d29922" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">بت الرسالة السرية (Secret Bit)</text>
    <text x="110" y="65" fill="#3fb950" font-family="monospace" font-size="24" font-weight="bold" text-anchor="middle">1</text>
  </g>

  <!-- Injection Result -->
  <g transform="translate(140, 190)">
    <rect width="320" height="85" rx="12" fill="#161b22" stroke="#3fb950" stroke-width="2.5"/>
    <text x="160" y="28" fill="#3fb950" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">بايت البكسل الحامل الناتج (Stego Byte)</text>
    <text x="160" y="65" fill="#ffffff" font-family="monospace" font-size="18" text-anchor="middle">1 1 0 1 0 1 1 <tspan fill="#3fb950" font-weight="bold">1</tspan> <tspan fill="#8b949e" font-size="12">(Δ = ±1)</tspan></text>
  </g>
</svg>
