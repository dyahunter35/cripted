<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <rect width="600" height="360" rx="16" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
  <text x="300" y="36" fill="#58a6ff" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Feistel Network Architecture (شبكة فيستل)</text>
  
  <!-- Inputs -->
  <rect x="80" y="70" width="180" height="40" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
  <text x="170" y="95" fill="#ffffff" font-family="monospace" font-size="14" text-anchor="middle">L_{i-1} (32-bit)</text>
  
  <rect x="340" y="70" width="180" height="40" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
  <text x="430" y="95" fill="#ffffff" font-family="monospace" font-size="14" text-anchor="middle">R_{i-1} (32-bit)</text>

  <!-- F function -->
  <rect x="310" y="150" width="120" height="50" rx="8" fill="#1f6feb" stroke="#58a6ff" stroke-width="2"/>
  <text x="370" y="180" fill="#ffffff" font-family="monospace" font-size="14" font-weight="bold" text-anchor="middle">F(R, K_i)</text>

  <!-- Subkey -->
  <text x="500" y="180" fill="#d29922" font-family="monospace" font-size="13">Subkey K_i</text>
  <line x1="480" y1="175" x2="435" y2="175" stroke="#d29922" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- XOR Circle -->
  <circle cx="170" cy="175" r="16" fill="#238636" stroke="#3fb950" stroke-width="2"/>
  <text x="170" y="181" fill="#ffffff" font-family="sans-serif" font-size="20" font-weight="bold" text-anchor="middle">⊕</text>

  <!-- Connecting Lines -->
  <line x1="170" y1="110" x2="170" y2="159" stroke="#8b949e" stroke-width="2"/>
  <line x1="430" y1="110" x2="430" y2="140" stroke="#8b949e" stroke-width="2"/>
  <line x1="430" y1="140" x2="370" y2="150" stroke="#8b949e" stroke-width="2"/>
  <line x1="310" y1="175" x2="186" y2="175" stroke="#58a6ff" stroke-width="2"/>

  <!-- Swap Lines -->
  <line x1="170" y1="191" x2="430" y2="270" stroke="#58a6ff" stroke-width="2"/>
  <line x1="430" y1="140" x2="170" y2="270" stroke="#3fb950" stroke-width="2"/>

  <!-- Outputs -->
  <rect x="80" y="270" width="180" height="40" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
  <text x="170" y="295" fill="#ffffff" font-family="monospace" font-size="14" text-anchor="middle">L_i = R_{i-1}</text>
  
  <rect x="340" y="270" width="180" height="40" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
  <text x="430" y="295" fill="#ffffff" font-family="monospace" font-size="14" text-anchor="middle">R_i = L_{i-1} ⊕ F</text>
</svg>
